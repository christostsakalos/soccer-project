[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-player-similarity"
version = "0.1.0"
description = "Step 1: provenance and audit of FBref player statistics"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "PyYAML>=6", "soccerdata==2026.43.0", "requests>=2.32"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
